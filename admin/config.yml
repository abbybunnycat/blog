backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: 'zh-Hant'

collections:
  - name: "blog"
    label: "漂流日記文章管理"
    files:
      - label: "所有文章列表"
        name: "posts"
        file: "data/posts.json"
        fields:
          - label: "文章清單"
            name: "posts"
            widget: "list"
            summary: "{{fields.date}} | [{{fields.category}}] {{fields.title}}"
            fields:
              - { label: "文章標題", name: "title", widget: "string" }
              - label: "文章分類"
                name: "category"
                widget: "select"
                options: ["聚餐", "出遊", "首飾", "穿搭", "造型", "生活小撇步"]
                default: "聚餐"
              - { label: "發佈日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "封面主圖（可從手機/電腦直接上傳）", name: "image", widget: "image" }
              - { label: "少女真實評分卡亮點（選填）", name: "highlight", widget: "string", required: false }
              - { label: "YouTube 影片網址（選填）", name: "youtube", widget: "string", required: false }
              - label: "更多照片寫真集（可一次上傳多張照片）"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "選擇照片", name: "image", widget: "image" }
              - { label: "文章摘要（顯示在首頁卡片上）", name: "summary", widget: "text", required: false }
              - { label: "文章詳細內容", name: "content", widget: "text" }
              - { label: "搜尋標籤（按 Enter 新增多個標籤）", name: "tags", widget: "list", required: false, default: ["生活紀錄"] }
