backend:
  name: github
  repo: abbybunnycat/blog
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: 'zh-Hant'

collections:
  - name: "articles"
    label: "漂流日記文章（每篇獨立・最新排最前）"
    folder: "posts"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - label: "🍽️ 聚餐不踩雷"
        field: "category"
        pattern: "聚餐"
      - label: "🏕️ 親子＆放風出遊"
        field: "category"
        pattern: "出遊"
      - label: "💍 我的首飾盒"
        field: "category"
        pattern: "首飾"
      - label: "👗 熟女微叛逆穿搭"
        field: "category"
        pattern: "穿搭"
    summary: "{{date}}｜[{{category}}] {{title}}"
    fields:
      - label: "文章標題"
        name: "title"
        widget: "string"
        hint: "建議包含地點或痛點關鍵字，對 Google 搜尋流量更有幫助！"
      - label: "文章分類"
        name: "category"
        widget: "select"
        options: ["聚餐", "出遊", "首飾", "穿搭", "造型", "生活小撇步"]
        default: "聚餐"
      - label: "發佈日期（YYYY-MM-DD）"
        name: "date"
        widget: "string"
        default: "2026-11-25"
      - label: "封面主圖"
        name: "image"
        widget: "image"
      - label: "少女真實評分卡亮點（選填）"
        name: "highlight"
        widget: "string"
        required: false
      - label: "YouTube 影片網址（選填）"
        name: "youtube"
        widget: "string"
        required: false
      - label: "更多照片寫真集（可新增多張照片）"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - label: "選擇照片"
            name: "image"
            widget: "image"
      - label: "文章摘要（顯示在首頁卡片上）"
        name: "summary"
        widget: "text"
        required: false
      - label: "文章詳細內容（支援段落間直接插入照片或貼 YouTube 網址！）"
        name: "content"
        widget: "markdown"
      - label: "搜尋標籤（請用逗號隔開）"
        name: "tags"
        widget: "string"
        required: false

  - name: "legacy_blog"
    label: "早期存檔文章（舊版清單）"
    files:
      - label: "早期 6 篇文章清單"
        name: "posts"
        file: "data/posts.json"
        fields:
          - label: "文章清單"
            name: "posts"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - label: "文章標題"
                name: "title"
                widget: "string"
              - label: "文章分類"
                name: "category"
                widget: "select"
                options: ["聚餐", "出遊", "首飾", "穿搭", "造型", "生活小撇步"]
                default: "聚餐"
              - label: "發佈日期（YYYY-MM-DD）"
                name: "date"
                widget: "string"
              - label: "封面主圖"
                name: "image"
                widget: "image"
              - label: "少女真實評分卡亮點（選填）"
                name: "highlight"
                widget: "string"
                required: false
              - label: "YouTube 影片網址（選填）"
                name: "youtube"
                widget: "string"
                required: false
              - label: "文章摘要"
                name: "summary"
                widget: "text"
                required: false
              - label: "文章詳細內容"
                name: "content"
                widget: "markdown"
              - label: "搜尋標籤"
                name: "tags"
                widget: "string"
                required: false
