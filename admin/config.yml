backend:
  name: github
  repo: abbybunnycat/blog
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: 'zh-Hant'

collections:
  - name: "blog"
    label: "漂流日記文章管理"
    files:
      - label: "所有文章列表"
        name: "posts"
        file: "data/posts.json"
        fields:
          - label: "文章清單"
            name: "posts"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - label: "文章標題"
                name: "title"
                widget: "string"
              - label: "文章分類"
                name: "category"
                widget: "select"
                options: ["聚餐", "出遊", "首飾", "穿搭", "造型", "生活小撇步"]
                default: "聚餐"
              - label: "發佈日期（YYYY-MM-DD）"
                name: "date"
                widget: "string"
                default: "2026-11-25"
              - label: "封面主圖（建議橫式照片）"
                name: "image"
                widget: "image"
              - label: "少女真實評分卡亮點（選填）"
                name: "highlight"
                widget: "string"
                required: false
              - label: "文末固定 YouTube 影片網址（選填；若想插在段落中間，請直接貼在下方內文裡）"
                name: "youtube"
                widget: "string"
                required: false
              - label: "更多照片寫真集（在文末顯示九宮格）"
                name: "gallery"
                widget: "list"
                required: false
                fields:
                  - label: "選擇照片"
                    name: "image"
                    widget: "image"
              - label: "文章摘要（顯示在首頁卡片上）"
                name: "summary"
                widget: "text"
                required: false
              - label: "文章詳細內容（支援段落間直接插入照片，或單獨一行貼上 YouTube 網址！）"
                name: "content"
                widget: "markdown"
              - label: "搜尋標籤（請用逗號隔開）"
                name: "tags"
                widget: "string"
                required: false
